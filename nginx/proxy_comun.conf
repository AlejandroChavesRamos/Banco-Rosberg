# Cabeceras que nginx agrega al reenviar peticiones al backend.
# X-Real-IP la escribe NGINX con la IP real de la conexion: el backend solo
# la cree si la peticion viene de nginx (PROXY_CONFIABLE). Se REEMPLAZA (no se
# agrega) X-Forwarded-For, para que un atacante no pueda colar una IP falsa.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_http_version 1.1;

# El backend limita la cookie de sesion a /auth; el navegador la ve en /api/auth
proxy_cookie_path /auth /api/auth;
