# =====================================================================
# Banco Rosberg - nginx de produccion
# Unica puerta de entrada: HTTPS en el puerto 443.
# =====================================================================

# --- Limite de peticiones por IP (anti fuerza bruta y anti abuso) -----
# login: 5 intentos por minuto por IP (con una "rafaga" de 5 extra)
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
# resto de la API: 30 peticiones por segundo por IP
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_status 429;     # 429 = Too Many Requests

# No revelar la version de nginx en errores ni cabeceras
server_tokens off;

# --- HTTP -> HTTPS ----------------------------------------------------
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# --- HTTPS ------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/rosberg.crt;
    ssl_certificate_key /etc/nginx/certs/rosberg.key;
    ssl_protocols       TLSv1.2 TLSv1.3;     # nada de SSL ni TLS 1.0/1.1 (inseguros)
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 1m;                 # ninguna peticion del banco necesita mas

    # --- Cabeceras de seguridad ---------------------------------------
    # CSP: el navegador solo ejecuta scripts de ESTE sitio (bloquea XSS
    # inyectados) y no se conecta a ningun otro servidor.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options        "DENY" always;                     # no se puede meter en un iframe (clickjacking)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;
    # HSTS ("usa siempre HTTPS") se activaria con un dominio real. En localhost
    # NO se activa: el navegador lo recordaria y romperia el modo desarrollo
    # (http://localhost:5173).
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- API ------------------------------------------------------------
    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://backend:8000/auth/login;
        include /etc/nginx/proxy_comun.conf;
    }
    location = /api/auth/2fa/verificar {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://backend:8000/auth/2fa/verificar;
        include /etc/nginx/proxy_comun.conf;
    }
    location /api/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://backend:8000/;      # /api/cuentas -> /cuentas
        include /etc/nginx/proxy_comun.conf;
    }

    # --- Pantallas (React compilado) -----------------------------------
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;          # rutas como /app/transferir las resuelve React
    }
}
