# Banco Rosberg: banco simulado con detector de fraude
#   mysql     -> fuente de verdad (el dinero)
#   neo4j     -> grafo de relaciones para detectar fraude
#   backend   -> API FastAPI
#   frontend  -> pantallas React: http://localhost:5173/app (clientes)
#                y http://localhost:5173/intranet (empleados)
#   simulador -> herramienta que no arranca con "up"; se usa con
#                docker compose run --rm simulador <comando>

services:
  mysql:
    image: mysql:8.4
    container_name: banco_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      REPORT_DB_USER: ${REPORT_DB_USER}
      REPORT_DB_PASSWORD: ${REPORT_DB_PASSWORD}
      SIM_DB_USER: ${SIM_DB_USER}
      SIM_DB_PASSWORD: ${SIM_DB_PASSWORD}
      TZ: ${TZ:-UTC}
    # Solo accesible desde tu propio PC (127.0.0.1), no desde la red.
    # 3307 porque tu MySQL local ya usa el 3306.
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Los scripts de esta carpeta se ejecutan SOLO la primera vez
      # (cuando el volumen esta vacio), en orden alfabetico.
      - ./db/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - red_interna

  neo4j:
    image: neo4j:5.26-community
    container_name: banco_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_max__size: 1G
      # Neo4j le dice al cliente a que puerto conectarse; debe ser el
      # puerto PUBLICADO en tu PC (7688), no el interno (7687)
      NEO4J_server_bolt_advertised__address: 127.0.0.1:7688
      NEO4J_server_http_advertised__address: 127.0.0.1:7475
      TZ: ${TZ:-UTC}
    # 7475/7688 para no chocar con Neo4j Desktop (7474/7687).
    ports:
      - "127.0.0.1:7475:7474"   # Neo4j Browser (web)
      - "127.0.0.1:7688:7687"   # Bolt (conexion de la app / Desktop)
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./db/neo4j:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - red_interna

  backend:
    build: ./backend
    container_name: banco_backend
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      APP_DB_USER: ${APP_DB_USER}            # nunca root
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      NEO4J_URI: bolt://neo4j:7687           # red interna: nombre del servicio y puerto interno
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      JWT_SECRETO: ${JWT_SECRETO}
      CLAVE_CIFRADO: ${CLAVE_CIFRADO}
      CLAVE_INDICES: ${CLAVE_INDICES}
      TZ: ${TZ:-UTC}
      WATCHFILES_FORCE_POLLING: "true"       # para que --reload detecte cambios hechos desde Windows
      # SOLO DESARROLLO: acepta la IP que envie la cabecera X-Forwarded-For
      # (el simulador la usa para simular clientes en distintas IPs).
      # En la Fase 6 solo se confiara en la que agregue nginx.
      CONFIAR_X_FORWARDED_FOR: "true"
    # --reload: al guardar un archivo .py la API se reinicia sola (solo en desarrollo)
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend/app:/codigo/app
      - ./db/neo4j:/scripts/neo4j:ro
    ports:
      - "127.0.0.1:8000:8000"
    # Docker pregunta cada 15 s si la API responde. /salud contesta aunque una
    # base este caida: la API sigue "sana" y avisa que esta "degradada".
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/salud', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      mysql:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - red_interna

  frontend:
    build: ./frontend
    container_name: banco_frontend
    restart: unless-stopped
    environment:
      API_URL: http://backend:8000           # Vite reenvia /api hacia aqui
    volumes:
      # El codigo se monta para que los cambios se vean al guardar;
      # node_modules se queda dentro del contenedor.
      - ./frontend/src:/codigo/src
      - ./frontend/index.html:/codigo/index.html
    ports:
      - "127.0.0.1:5173:5173"
    healthcheck:
      # 127.0.0.1 y no "localhost": dentro del contenedor localhost apunta a IPv6 y Vite escucha en IPv4
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173/app || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      - backend
    networks:
      - red_interna

  simulador:
    build: ./backend                         # reutiliza el codigo del backend
    profiles: ["herramientas"]               # no arranca con "docker compose up"
    entrypoint: ["python", "-m", "app.simulador"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      APP_DB_USER: ${SIM_DB_USER}            # su propio usuario de MySQL, no el de la app
      APP_DB_PASSWORD: ${SIM_DB_PASSWORD}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      JWT_SECRETO: ${JWT_SECRETO}
      CLAVE_CIFRADO: ${CLAVE_CIFRADO}
      CLAVE_INDICES: ${CLAVE_INDICES}
      SIM_PASSWORD_CLIENTES: ${SIM_PASSWORD_CLIENTES}
      API_URL: http://backend:8000
      TZ: ${TZ:-UTC}
    volumes:
      - ./backend/app:/codigo/app
      - ./db/neo4j:/scripts/neo4j:ro
    depends_on:
      - backend
    networks:
      - red_interna

volumes:
  mysql_data:
  neo4j_data:
  neo4j_logs:

networks:
  red_interna:
    driver: bridge
